spring.application.name=myBank

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# Keep console logs compact and consistently aligned.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{28} - %msg%n